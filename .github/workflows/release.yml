# Manual release: Actions -> release -> Run workflow on main with version 1.2.3 -> strict check + pack 1.2.3
# (template + Jex.Cli) -> full template matrix -> publish those exact nupkgs -> tag v1.2.3 on the built commit and
# create the GitHub release. Merging to main never publishes anything (pushes only run pipeline.yml).
# NuGet uses Trusted Publishing (OIDC): configure a trusted publishing policy for this repository and
# workflow on nuget.org and set the NUGET_USER repository variable to the nuget.org account name. The policy
# must cover both package ids, Jex.CleanArchitecture.Template and Jex.Cli (check this before the first release
# that creates Jex.Cli).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix (e.g. 3.0.2 or 3.1.0-rc.1)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: parse
        name: Validate version, branch and tag
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$INPUT_VERSION' is not a semantic version (e.g. 2.0.0 or 2.1.0-rc.1)."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases run from main only (this run is on $GITHUB_REF)."
            exit 1
          fi
          if [[ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]]; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  template-tests:
    needs: ci
    uses: ./.github/workflows/template-tests.yml
    with:
      artifact-name: ${{ needs.ci.outputs.artifact-name }}
      version: ${{ needs.ci.outputs.version }}

  publish:
    needs: [ version, ci, template-tests ]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: CHANGELOG has an entry for this version
        shell: bash
        run: |
          grep -q "^## \[${{ needs.version.outputs.version }}\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [${{ needs.version.outputs.version }}]' section."
            exit 1
          }

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download the verified package (not rebuilt)
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.artifact-name }}
          path: nupkg

      - name: NuGet login (Trusted Publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Pre-release versions (3.0.0-rc.1) must not become the repository's "Latest" release.
          flags=""
          if [[ "${{ needs.version.outputs.version }}" == *-* ]]; then flags="--prerelease --latest=false"; fi
          # Creates the tag on the exact commit that was built and verified.
          gh release create "$TAG" nupkg/*.nupkg --title "$TAG" --target "$GITHUB_SHA" --generate-notes $flags
