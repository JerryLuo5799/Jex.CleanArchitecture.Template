# Tag v1.2.3 -> strict check + pack 1.2.3 (template + Jex.Cli) -> full template matrix -> publish those exact nupkgs.
# NuGet uses Trusted Publishing (OIDC): configure a trusted publishing policy for this repository and
# workflow on nuget.org and set the NUGET_USER repository variable to the nuget.org account name. The policy
# must cover both package ids, Jex.CleanArchitecture.Template and Jex.Cli (check this before the first release
# that creates Jex.Cli).
name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        name: Tag -> package version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not v<semver> (e.g. v2.0.0 or v2.1.0-rc.1)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  template-tests:
    needs: ci
    uses: ./.github/workflows/template-tests.yml
    with:
      artifact-name: ${{ needs.ci.outputs.artifact-name }}
      version: ${{ needs.ci.outputs.version }}

  publish:
    needs: [ version, ci, template-tests ]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: CHANGELOG has an entry for this version
        shell: bash
        run: |
          grep -q "^## \[${{ needs.version.outputs.version }}\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [${{ needs.version.outputs.version }}]' section."
            exit 1
          }

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download the verified package (not rebuilt)
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.artifact-name }}
          path: nupkg

      - name: NuGet login (Trusted Publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pre-release versions (3.0.0-rc.1) must not become the repository's "Latest" release.
          flags=""
          if [[ "${{ needs.version.outputs.version }}" == *-* ]]; then flags="--prerelease --latest=false"; fi
          gh release create "$GITHUB_REF_NAME" nupkg/*.nupkg --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $flags
