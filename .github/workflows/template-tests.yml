# Reusable: install the template package and the jex CLI produced by ci.yml in the same run, generate every
# supported template combination, scaffold a feature with that jex and run the strict gate in each project.
name: template-tests

on:
  workflow_call:
    inputs:
      artifact-name:
        description: nupkg artifact uploaded by ci.yml in this run.
        required: true
        type: string
      version:
        description: Version of both packages in the artifact.
        required: true
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  matrix:
    name: ${{ matrix.cell }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cell: sqlite, os: ubuntu-latest, test-database: sqlite, docker: true }
          - { cell: sqlite, os: windows-latest, test-database: sqlite, docker: false }
          - { cell: postgresql, os: ubuntu-latest, test-database: provider, docker: false }
          - { cell: sqlserver, os: ubuntu-latest, test-database: provider, docker: false }
          - { cell: mysql, os: ubuntu-latest, test-database: provider, docker: false }
          - { cell: aspire, os: ubuntu-latest, test-database: provider, docker: true }
          - { cell: bare, os: ubuntu-latest, test-database: sqlite, docker: false }
    env:
      # provider = run integration tests against the real database in Testcontainers; a missing
      # Docker daemon fails the job instead of silently falling back to SQLite.
      TEST_DATABASE: ${{ matrix.test-database }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: nupkg

      # --source replaces every NuGet source (--add-source would only add one, and nuget.org could win the race
      # for a version that is already published), and the isolated package folder rules out a stale cache.
      - name: Install the jex CLI from this run's artifact
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-isolated
        run: |
          dotnet tool install --global Jex.Cli --version "${{ inputs.version }}" --source "$PWD/nupkg"
          tools="$HOME/.dotnet/tools"
          if [ "$RUNNER_OS" = "Windows" ]; then tools="$USERPROFILE\\.dotnet\\tools"; fi
          echo "$tools" >> "$GITHUB_PATH"

      - name: The installed jex is this build
        shell: bash
        run: |
          actual="$(jex --version)"
          if [ "$actual" != "${{ inputs.version }}" ]; then
            echo "::error::jex --version printed '$actual', expected ${{ inputs.version }}."
            exit 1
          fi

      - name: Generate, scaffold and verify
        shell: bash
        run: |
          extra=""
          if [ "${{ matrix.docker }}" = "true" ]; then extra="--docker"; fi
          cli="$HOME/.dotnet/tools/jex"
          if [ "$RUNNER_OS" = "Windows" ]; then cli="$USERPROFILE\\.dotnet\\tools\\jex.exe"; fi
          jex dev matrix --package "nupkg/Jex.CleanArchitecture.Template.${{ inputs.version }}.nupkg" \
            --cells ${{ matrix.cell }} $extra --jex "$cli"

      - name: Upload generated project on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: generated-${{ matrix.cell }}-${{ matrix.os }}
          path: |
            artifacts/matrix
            !artifacts/matrix/**/bin
            !artifacts/matrix/**/obj
