name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: templates/solution/Jex.slnx

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Format check
        run: dotnet format ${{ env.SOLUTION }} --no-restore --verify-no-changes

      - name: Build (warnings as errors)
        run: dotnet build ${{ env.SOLUTION }} --no-restore -c Release -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test --solution ${{ env.SOLUTION }} --no-build -c Release --report-trx --results-directory TestResults
        working-directory: templates/solution

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: templates/solution/TestResults

      - name: Pack template
        run: dotnet pack Jex.CleanArchitecture.Template.csproj -c Release -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
