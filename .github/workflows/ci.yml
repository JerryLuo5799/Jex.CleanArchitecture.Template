# Reusable: strict check of the template source and the jex CLI, then pack both NuGet packages once with the
# same version. Called by pipeline.yml (PR / push / manual) and release.yml (manual release). Never triggered directly, so
# every entry point produces exactly one pair of packages that the template matrix then verifies.
name: ci

on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into both packages (template and Jex.Cli).
        required: true
        type: string
    outputs:
      artifact-name:
        description: Name of the uploaded nupkg artifact.
        value: ${{ jobs.pack.outputs.artifact-name }}
      version:
        description: Version of the packages in the artifact.
        value: ${{ inputs.version }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: templates/solution/Jex.slnx
  CLI_SOLUTION: Jex.CleanArchitecture.slnx

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Format check
        run: dotnet format ${{ env.SOLUTION }} --no-restore --verify-no-changes

      - name: Build (warnings as errors, NU1903/NU1904 fail)
        run: dotnet build ${{ env.SOLUTION }} --no-restore -c Release -p:ContinuousIntegrationBuild=true

      - name: OpenAPI contract is up to date
        run: |
          git diff --exit-code -- templates/solution/openapi.json || {
            echo "::error::openapi.json changed during the build. Run 'jex build' in templates/solution locally and commit the regenerated file."
            exit 1
          }

      - name: Test
        working-directory: templates/solution
        run: dotnet test --solution Jex.slnx --no-build -c Release --report-trx --results-directory ../../TestResults

      - name: Restore (jex CLI)
        run: dotnet restore ${{ env.CLI_SOLUTION }}

      - name: Format check (jex CLI)
        run: dotnet format ${{ env.CLI_SOLUTION }} --no-restore --verify-no-changes

      - name: Build (jex CLI, warnings as errors)
        run: dotnet build ${{ env.CLI_SOLUTION }} --no-restore -c Release -p:ContinuousIntegrationBuild=true

      - name: Test (jex CLI)
        run: dotnet test --project src/Jex.Cli.Tests/Jex.Cli.Tests.csproj --no-build -c Release --report-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults

  pack:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-name: nupkg-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack (template + Jex.Cli, same version)
        run: dotnet pack ${{ env.CLI_SOLUTION }} -c Release -p:Version=${{ inputs.version }} -o artifacts

      - name: Exactly the two expected packages
        shell: bash
        run: |
          ls -1 artifacts/*.nupkg
          count=$(ls -1 artifacts/*.nupkg | wc -l)
          if [ "$count" -ne 2 ] \
            || [ ! -f "artifacts/Jex.CleanArchitecture.Template.${{ inputs.version }}.nupkg" ] \
            || [ ! -f "artifacts/Jex.Cli.${{ inputs.version }}.nupkg" ]; then
            echo "::error::Expected exactly Jex.CleanArchitecture.Template and Jex.Cli ${{ inputs.version }} in artifacts/."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg-${{ github.run_id }}
          path: artifacts/*.nupkg
          if-no-files-found: error
