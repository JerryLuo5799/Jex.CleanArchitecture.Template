# Task runner for this project (https://taskfile.dev). Every task wraps a plain dotnet/docker
# command shown in AGENTS.md §10, so nothing here is required to work on the code.
#
#   winget install Task.Task | brew install go-task | scoop install task | npm i -g @go-task/cli
#
# The one command that matters: `task check` (format + build + test).

version: '3'

vars:
  SLN: Jex.slnx
  API: src/Jex.WebAPI
  TPL: TPLPREFIX
  SOLUTION_NAME: Jex
  DBPROFILE: DB_PROFILE

tasks:
  default:
    cmds:
      - task --list

  # ── Build & test ──────────────────────────────────────────────────────────
  build:
    desc: Build the solution
    cmds:
      - dotnet build {{.SLN}}

  format:
    desc: Apply code formatting
    cmds:
      - dotnet format {{.SLN}}

  format:check:
    desc: Verify formatting (no changes)
    cmds:
      - dotnet format {{.SLN}} --verify-no-changes

  test:
    desc: Run all tests
    cmds:
      - dotnet test --solution {{.SLN}}

  test:unit:
    desc: Unit tests only (fast loop)
    cmds:
      - dotnet test --project tests/Jex.UnitTests/Jex.UnitTests.csproj

  test:integration:
    desc: Integration tests (in-memory host on SQLite)
    cmds:
      - dotnet test --project tests/Jex.IntegrationTests/Jex.IntegrationTests.csproj

  test:arch:
    desc: Architecture rule tests
    cmds:
      - dotnet test --project tests/Jex.ArchitectureTests/Jex.ArchitectureTests.csproj

  check:
    desc: The acceptance gate - format, build, test
    cmds:
      - task: format
      - task: build
      - task: test

  check:ci:
    desc: Same as CI - formatting verified, warnings are errors
    cmds:
      - task: format:check
      - dotnet build {{.SLN}} -c Release -p:ContinuousIntegrationBuild=true
      - dotnet test --solution {{.SLN}} -c Release --no-build

  # ── Run ───────────────────────────────────────────────────────────────────
  run:
    desc: Run the API (Development, http://localhost:5208, Scalar UI at /scalar)
    cmds:
      - dotnet run --project {{.API}}

  watch:
    desc: Run with hot reload
    cmds:
      - dotnet watch --project {{.API}}

  #if (UseAspire)
  run:aspire:
    desc: Run through the .NET Aspire AppHost (dashboard, orchestrated dependencies)
    cmds:
      - dotnet run --project src/Jex.AppHost
  #endif

  # ── Database ──────────────────────────────────────────────────────────────
  #if (IncludeDocker)
  infra:up:
    desc: Start local infrastructure (docker compose profile {{.DBPROFILE}})
    cmds:
      - '{{if eq .DBPROFILE "none"}}echo "SQLite needs no infrastructure"{{else}}docker compose --profile {{.DBPROFILE}} up -d --wait{{end}}'

  infra:down:
    desc: Stop local infrastructure and drop its volumes
    cmds:
      - '{{if eq .DBPROFILE "none"}}echo "SQLite needs no infrastructure"{{else}}docker compose --profile {{.DBPROFILE}} down -v{{end}}'
  #endif

  db:reset:
    desc: Delete the local SQLite database (recreated with seed data on next run)
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -Command "Remove-Item -Force -ErrorAction SilentlyContinue {{.API}}/*.db, {{.API}}/*.db-*"{{else}}rm -f {{.API}}/*.db {{.API}}/*.db-*{{end}}'

  db:script:
    desc: 'Generate the next migration from the entity model: task db:script NAME=add-orders'
    cmds:
      - dotnet run --project {{.API}} --no-launch-profile -- db-script {{.NAME | default "update"}}

  db:migrate:
    desc: Apply pending migrations to the configured database
    cmds:
      - dotnet build {{.API}}
      - dotnet run --project {{.API}} --no-build --no-launch-profile -- migrate

  db:migrate:dry-run:
    desc: List pending migrations without applying them
    cmds:
      - dotnet run --project {{.API}} --no-launch-profile -- migrate --dry-run

  # ── Scaffolding (dotnet new item templates installed with the solution template) ──
  scaffold:usecase:
    desc: 'task scaffold:usecase USECASE=CreateOrder FEATURE=Orders TYPE=command RETURN=long'
    cmds:
      - dotnet new {{.TPL}}-usecase -n {{.USECASE}} --feature {{.FEATURE}} --usecase-type {{.TYPE | default "command"}} --return-type {{.RETURN | default "Unit"}} --with-id {{.WITH_ID | default "false"}} --paged {{.PAGED | default "false"}} --solution-name {{.SOLUTION_NAME}} -o .

  scaffold:endpoint:
    desc: 'task scaffold:endpoint FEATURE=Orders [ENTITY=Order]'
    cmds:
      - dotnet new {{.TPL}}-endpoint -n {{.FEATURE}}{{if .ENTITY}} --entity {{.ENTITY}}{{end}} --solution-name {{.SOLUTION_NAME}} -o .

  scaffold:entity:
    desc: 'task scaffold:entity ENTITY=Order PLURAL=Orders'
    cmds:
      - dotnet new {{.TPL}}-entity -n {{.ENTITY}} --plural {{.PLURAL}} --solution-name {{.SOLUTION_NAME}} -o .

  scaffold:feature:
    desc: 'Entity + create/get use cases + endpoint group: task scaffold:feature ENTITY=Order PLURAL=Orders'
    cmds:
      - task: scaffold:entity
        vars: { ENTITY: '{{.ENTITY}}', PLURAL: '{{.PLURAL}}' }
      - task: scaffold:usecase
        vars: { USECASE: 'Create{{.ENTITY}}', FEATURE: '{{.PLURAL}}', TYPE: command, RETURN: long }
      - task: scaffold:usecase
        vars: { USECASE: 'Get{{.ENTITY}}ById', FEATURE: '{{.PLURAL}}', TYPE: query, RETURN: '{{.ENTITY}}Dto', WITH_ID: 'true' }
      - task: scaffold:endpoint
        vars: { FEATURE: '{{.PLURAL}}', ENTITY: '{{.ENTITY}}' }
